<!DOCTYPE html>
<html>
<head>
  <title>Inspect GIF Coordinates</title>
  <style>
    body {
      margin: 0;
      background: #1e1e1e;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      position: relative;
      border: 2px solid red;
    }
    img {
      display: block;
      max-width: 100%;
      height: auto;
    }
    #coords {
      margin-top: 20px;
      font-size: 20px;
      background: rgba(0,0,0,0.8);
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Click the laptop screen in the GIF below</h1>
  <div class="container" id="container">
    <img src="/images/pixel-art-gallery.gif" id="gif" />
  </div>
  <div id="coords">Click anywhere on the image...</div>

  <script>
    const gif = document.getElementById('gif');
    const coords = document.getElementById('coords');
    gif.addEventListener('click', (e) => {
      const rect = e.target.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const w = rect.width;
      const h = rect.height;
      const pctX = (x / w) * 100;
      const pctY = (y / h) * 100;
      coords.innerHTML = `
        Natural Size: ${gif.naturalWidth} x ${gif.naturalHeight} px<br>
        Clicked Pixel relative to current size: X=${x.toFixed(1)}, Y=${y.toFixed(1)} px (w=${w.toFixed(1)}, h=${h.toFixed(1)})<br>
        Percentage: X=${pctX.toFixed(2)}%, Y=${pctY.toFixed(2)}%
      `;
      console.log(`Clicked X: ${pctX.toFixed(2)}%, Y: ${pctY.toFixed(2)}%`);
    });
  </script>
</body>
</html>
